<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>머니파이 공지</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#F2F2F2;
    color:#222222;
    font-family:'Inter', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    font-size:15px;
    font-weight:500;
    min-height:100vh;
  }
  .btn{
    background:transparent;border:1px solid #D5D5D5;color:#666666;
    padding:7px 14px;border-radius:6px;cursor:pointer;font-size:14px;font-family:inherit;font-weight:600;
  }
  .btn:hover{border-color:#999999;color:#222222;}
  .btn-primary{background:#4FC3F7;color:#111;border-color:#4FC3F7;}
</style>
</head>
<body>

<div id="noticeModal" style="display:flex;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:3000;align-items:center;justify-content:center;padding:20px;">
  <div style="position:relative;background:#FFFFFF;border:1px solid #E0E0E0;border-radius:10px;padding:24px;width:380px;max-width:100%;max-height:78vh;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,0.25);">
    <h3 style="margin:0 0 4px;font-size:17px;font-weight:700;color:#1A1A1A;">찰리 멍거</h3>
    <div style="font-size:12px;color:#999999;margin-bottom:14px;">IQ보다 중요한 성공의 자질 10가지</div>
    <hr style="border:none;border-top:1px solid #E2E2E2;margin:0 10px 16px 10px;">
    <div style="font-size:13px;line-height:2.1;color:#333333;">
      <div><b>1. 기질</b> — 압박 속 침착함</div>
      <div><b>2. 평생 학습</b> — 꾸준히 배우는 습관</div>
      <div><b>3. 능력의 범위</b> — 아는 것과 모르는 것의 구분</div>
      <div><b>4. 어리석음 피하기</b> — 명백한 실수를 피하는 것</div>
      <div><b>5. 인내심</b> — 기다릴 줄 아는 힘</div>
      <div><b>6. 질투로부터의 자유</b> — 비교에 흔들리지 않기</div>
      <div><b>7. 다학제적 사고</b> — 여러 분야를 연결하는 시각</div>
      <div><b>8. 실수 직시하기</b> — 솔직하게 마주하는 규율</div>
      <div><b>9. 신뢰성과 진실성</b> — 평판을 쌓는 일</div>
      <div style="margin-bottom:0;"><b>10. 독립적인 판단</b> — 군중에 휩쓸리지 않는 소신</div>
      <div style="height:2.1em;"></div>
    </div>
    <label style="display:flex;align-items:center;gap:6px;margin-top:20px;font-size:13px;color:#777777;cursor:pointer;">
      <input type="checkbox" id="noticeDontShowAgain">
      다시 보지 않기
    </label>
    <div style="display:flex;justify-content:flex-end;margin-top:12px;">
      <button class="btn btn-primary" id="noticeOkBtn" style="font-size:18px;line-height:1;padding:6px 16px;">✓</button>
    </div>
  </div>
</div>

<script>
document.getElementById('noticeOkBtn').addEventListener('click', () => {
  document.getElementById('noticeModal').style.display = 'none';
});
</script>

</body>
</html>
