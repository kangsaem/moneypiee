#splash{position:fixed;inset:0;z-index:100;background:#0f2a3d;display:flex;flex-direction:column;align-items:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));box-sizing:border-box}

  cns:['CNS% (산소 독성 누적)','높은 산소 분압에 노출된 양을 NOAA 허용 시간 대비 %로 누적(예: 1.4bar 150분, 1.6bar 45분 = 100%). 0.5bar 이하는 쌓이지 않음. 60% 이상 주황(근접 경고), 80% 이상 빨간색. 재생 중엔 그 시점 값, 아니면 다이빙 끝 값. 수면휴식 90분마다 절반으로 줄어듦. 나이트록스일 때만 표시.'],

  water:['수질','해수는 10m당 약 1.005bar, 담수는 0.981bar. 담수가 같은 수심에서 압력이 조금 낮음.'],
  gas:['기체','공기는 산소 21%·질소 79%. 나이트록스(EAN)는 산소를 늘리고 질소를 줄여 NDL이 길어지지만, 산소 독성 때문에 내려갈 수 있는 최대 수심(MOD)이 얕아짐.'],
  cons:['보수도 (GF Low/High)','그래디언트 팩터. Low는 첫 감압 정지 깊이(낮을수록 깊게 멈춤), High는 수면 도착 때 허용 한계(낮을수록 NDL 짧고 정지 길어짐). 높음 35/75 · 중간 40/85 · 낮음 45/95 (가민·쉐어워터 기본값).'],
  asc:['상승속도','추천 플랜이 올라갈 때 쓰는 속도. 기본 분당 9m. 내가 그린 경로의 급상승 경고는 분당 10m 기준.'],
  path:['내 경로','직접 그린 수심 이동. 0m에 닿으면 그 지점에서 다이빙 종료.'],
  plan:['추천 경로','그린 경로가 출수 전에 끝나면 그 지점부터, 감압 정지(3m 단위)와 5m 3분 안전정지를 넣어 계산한 상승 경로. 출수까지 다 그렸는데 5m 안전정지를 안 했으면 5m를 지나는 지점부터 안전정지 경로를 비교용으로 표시(통계는 내 경로 기준).'],
  ceil:['천장 (실링 · 상승 한계 수심)','이보다 얕게 올라가면 GF 한계를 넘는 수심. 0m면 바로 출수 가능.'],
  fast:['급상승','분당 10m보다 빠르게 올라간 구간. 기포 생성 위험이 커짐.'],
  mod:['MOD (최대 운용 수심)','산소 분압이 1.2·1.4·1.6bar가 되는 수심. 진한 선(1.4)이 기준이고, 넘으면 경고. 1.2는 보수적 기준, 1.6은 비상 한계. 나이트록스일 때 그래프 범위 안에 들어오면 표시.'],
  on:['질소 흡수 중','들이마시는 질소 분압이 조직보다 높아 질소가 쌓이는 중 (주로 내려가거나 깊이 머물 때).'],
  off:['질소 배출 중','조직의 질소가 들이마시는 것보다 높아 빠져나가는 중 (주로 올라올 때·수면 휴식 중).'],
  pct:['막대 %','조직 질소분압 ÷ 수면 허용한계(GF High). 100%를 넘는 구획이 하나라도 있으면 바로 출수 불가 = 감압 필요.'],
  deco:['감압 필요','NDL을 넘겨, 출수 전에 정해진 수심에서 정해진 시간 동안 멈춰야 하는 상태.'],
  nodeco:['무감압','감압 정지 없이 바로 출수할 수 있는 상태. 안전정지만 권장.'],
  safety:['안전정지','5m에서 3분. 의무 정지는 아니지만 기포를 줄이기 위해 권장. 추천 경로에 자동으로 포함.'],
  tank:['탱크','탱크 내부 용량(L)과 충전 압력(bar). 다이빙마다 가득 채운 탱크 1개로 계산. 그래프 오른쪽 끝 막대가 남은 공기(잔압)이고, 주황선이 50bar(출수 여유분).'],
  sac:['호흡량 (SAC)','수면에서 1분에 마시는 공기량. 수심이 깊을수록 압력만큼 더 씀(20m=3배). 초보는 대개 20~25 L/분. 긴장·추위·운동하면 늘어남.'],
  gf99:['GF99 (현재 GF)','지금 수심 기준으로, 가장 많이 쌓인 구획이 주변 압력과 M값 사이 어디쯤인지(%). 0% = 주변 압력 이하, 100% = M값. 감압 정지 중 이 값이 GF 설정보다 낮으면 더 올라가도 됨(쉐어워터 표기).<br>이름의 "99"는 특별한 계산 의미가 없음. 쉐어워터가 유래를 밝히지 않았고, 화면 라벨 글자 수 제한 때문이라는 추측 등이 있음. 뜻은 "지금 수심 기준 GF".'],
  swIn:['들이마신 질소','지금 들이마시는 질소의 분압. 막대가 이 선보다 짧으면 흡수, 길면 배출.'],
  swAmb:['주변 압력','지금 수심의 압력. 막대가 이 선을 넘는 것(과포화, 점선 테두리)은 정상 = 질소가 빠지는 중. 위험 기준은 GF 한계선과 M값.'],
  swGF:['GF 한계(천장)','지금 수심에서 설정한 GF로 허용되는 한계. 첫 정지 근처는 GF Low, 수면에 가까울수록 GF High로 오른쪽으로 이동. 가장 긴 막대가 이 선에 닿으면 지금 수심 = 천장.'],
  swM:['M값','뷜만 원래 허용 한계(보수도 미적용). 쉐어워터처럼 구획마다 눈금을 달리해 모든 구획의 M값을 같은 위치(오른쪽 선)에 맞춤. 수심이 바뀌면 눈금도 바뀜.'],
  si:['수면휴식','앞 다이빙과 이번 다이빙 사이에 수면에서 쉰 시간. 남은 질소가 다음 다이빙에 이어짐. 누르면 시간 변경.']
 }
},

 tips:{
  t:['Elapsed time','Time from the start of the dive to the current playback position.'],
  d:['Depth','Depth at the current playback position.'],
  ndl:['NDL / Ceiling','NDL (no-decompression limit): time left at this depth before you can no longer surface directly without deco stops.<br>Ceiling: shown instead once deco is required. Do not ascend shallower than this depth.'],
  tts:['TTS (time to surface)','Total time to reach the surface following the suggested ascent from now: ascent + deco stops + 5 m safety stop. Compare it with your remaining gas.'],
  gf:['Surface GF','If you surfaced right now without stopping, how close the most-loaded compartment would be to its limit (%). 0% = no supersaturation, 100% = the raw Bühlmann limit (M-value). Red when above your GF High = you cannot surface directly.'],
  cns:['CNS% (oxygen toxicity clock)','Accumulated oxygen exposure as a % of the NOAA single-exposure limits (e.g. 150 min at 1.4 bar or 45 min at 1.6 bar = 100%). Nothing accumulates at 0.5 bar or below. Orange at 60%+ (approaching), red at 80%+. Shows the value at the playback time, otherwise at the end of the dive. Halves every 90 min of surface interval. Shown for nitrox only.'],
  po2:['PO₂ (oxygen partial pressure)','Partial pressure of the oxygen you breathe (bar). Red above 1.4 = oxygen toxicity risk.'],
  alt:['Altitude','At altitude the surface pressure is lower, so the same depth carries a larger decompression burden. Assumes you are acclimatised.'],
  water:['Water type','Salt water adds about 1.005 bar per 10 m, fresh water 0.981 bar. Fresh water gives slightly less pressure at the same depth.'],
  gas:['Gas','Air is 21% oxygen / 79% nitrogen. Nitrox (EAN) adds oxygen and reduces nitrogen, so NDLs get longer, but oxygen toxicity makes the maximum operating depth (MOD) shallower.'],
  cons:['Conservatism (GF Low/High)','Gradient factors. Low sets the depth of the first deco stop (lower = deeper stops). High sets the limit on reaching the surface (lower = shorter NDL, longer stops). High 35/75 · Medium 40/85 · Low 45/95 (Garmin and Shearwater presets).'],
  asc:['Ascent rate','Ascent rate used for the suggested ascent. Default 9 m/min. The fast-ascent warning on your own profile triggers above 10 m/min.'],
  path:['My profile','The depth profile you drew. The dive ends where it first reaches 0 m.'],
  plan:['Suggested ascent','If your profile ends before surfacing, an ascent from that point with deco stops (3 m steps) and a 3-minute safety stop at 5 m. If you drew all the way up without a safety stop, a safety-stop path from where you pass 5 m is shown for comparison (stats still follow your profile).'],
  ceil:['Ceiling','The shallowest depth you may ascend to without exceeding the GF limit. 0 m means you can surface directly.'],
  fast:['Fast ascent','Sections where you ascended faster than 10 m/min. Raises the risk of bubble formation.'],
  mod:['MOD (maximum operating depth)','Depths where oxygen partial pressure reaches 1.2 / 1.4 / 1.6 bar. The bold 1.4 line is the limit used for warnings; 1.2 is conservative, 1.6 is the contingency maximum. Shown when within the graph range (nitrox).'],
  on:['N₂ on-gassing','The nitrogen you breathe is at a higher pressure than in the tissue, so nitrogen is building up (mostly when descending or staying deep).'],
  off:['N₂ off-gassing','The tissue holds more nitrogen than you breathe, so it is leaving (mostly when ascending or during a surface interval).'],
  pct:['Bar %','Tissue nitrogen pressure ÷ surfacing limit (GF High). If any compartment is above 100% you cannot surface directly = deco required.'],
  deco:['Deco required','You have passed the NDL and must stop at set depths for set times before surfacing.'],
  nodeco:['No-deco','You can surface without deco stops. A safety stop is still recommended.'],
  safety:['Safety stop','3 minutes at 5 m. Not mandatory, but recommended to reduce bubbles. Included automatically in the suggested ascent.'],
  tank:['Tank','Water capacity (L) and fill pressure (bar). Each dive starts with one full tank. The bar at the right edge of the graph is remaining gas; the orange mark is 50 bar (reserve).'],
  sac:['Breathing (SAC)','Air you breathe per minute at the surface. Deeper means more (20 m = 3×). New divers are typically 20–25 L/min; stress, cold and effort raise it.'],
  gf99:['GF99 (current GF)','At the current depth, where the most-loaded compartment sits between ambient pressure and its M-value (%). 0% = at or below ambient, 100% = M-value. During deco, if it is below your GF you may ascend further (Shearwater convention).<br>The "99" has no mathematical meaning. Shearwater has not explained the name; one guess is a short on-screen label limit. It simply means "GF at the current depth".'],
  swIn:['Inspired N₂','Partial pressure of the nitrogen you breathe now. Bars shorter than this line are on-gassing, longer ones off-gassing.'],
  swAmb:['Ambient','Pressure at the current depth. Bars beyond this line (supersaturated, dotted outline) are normal = nitrogen is leaving. The danger markers are the GF limit line and the M-value.'],
  swGF:['GF limit (ceiling)','Limit allowed by your GF setting at the current depth: GF Low near the first stop, moving right toward GF High as you approach the surface. When the longest bar touches this line, your current depth is the ceiling.'],
  swM:['M-value','Raw Bühlmann limit (no conservatism). As on Shearwater, each compartment is scaled so all M-values line up at the right-hand line. The scale changes with depth.'],
  si:['Surface interval','Time spent at the surface between the previous dive and this one. Residual nitrogen carries over. Tap to change.']
 }

 tips:{
  t:['経過時間','ダイビング開始から現在の再生位置までの時間。'],
  d:['水深','現在の再生位置の水深。'],
  ndl:['NDL / シーリング','NDL(無減圧限界): 今の水深に留まった場合に、減圧停止なしで直接浮上できる残り時間。<br>シーリング: 減圧が必要になると代わりに表示。これより浅く浮上してはいけない水深。'],
  tts:['TTS (浮上までの時間)','今から推奨プラン通りに浮上した場合に水面に着くまでの合計時間。浮上 + 減圧停止 + 5m安全停止を含む。残りガスと比べる目安。'],
  gf:['水面 GF','今すぐ停止せずに浮上したと仮定したとき、最も窒素が溜まったコンパートメントが限界にどれだけ近いか(%)。0% = 過飽和なし、100% = ビュールマン本来の限界(M値)。設定した GF High を超えると赤 = 直接浮上不可。'],
  cns:['CNS% (酸素毒性の蓄積)','高い酸素分圧への曝露量をNOAA許容時間に対する%で累積(例: 1.4barで150分、1.6barで45分 = 100%)。0.5bar以下では増えない。60%以上でオレンジ(接近警告)、80%以上で赤。再生中はその時点の値、それ以外はダイブ終了時の値。水面休息90分ごとに半減。ナイトロックスの時のみ表示。'],
  po2:['PO₂ (酸素分圧)','吸っている酸素の分圧(bar)。1.4を超えると赤 = 酸素中毒の危険。'],
  alt:['標高','標高が高いと水面気圧が低く、同じ水深でも減圧の負担が大きくなる。その標高に順応した状態を想定。'],
  water:['水の種類','海水は10mごとに約1.005bar、淡水は0.981bar。淡水は同じ水深で圧力がやや低い。'],
  gas:['ガス','空気は酸素21%・窒素79%。ナイトロックス(EAN)は酸素を増やし窒素を減らすためNDLが長くなるが、酸素毒性のため最大運用水深(MOD)が浅くなる。'],
  cons:['保守性 (GF Low/High)','グラディエントファクター。Low は最初の減圧停止の深さ(低いほど深く止まる)、High は水面到着時の許容限界(低いほどNDLが短く停止が長い)。高 35/75 · 中 40/85 · 低 45/95 (Garmin・Shearwater の初期値)。'],
  asc:['浮上速度','推奨プランの浮上に使う速度。初期値 毎分9m。自分の経路の急浮上警告は毎分10mが基準。'],
  path:['自分の経路','自分で描いた水深の動き。0mに達した地点でダイビング終了。'],
  plan:['推奨経路','描いた経路が浮上前に終わった場合、その地点から減圧停止(3m刻み)と5m 3分の安全停止を入れて計算した浮上経路。浮上まで描いたのに5mの安全停止をしていない場合は、5mを通過する地点から安全停止の経路を比較用に表示(統計は自分の経路が基準)。'],
  ceil:['シーリング','これより浅く浮上すると GF の限界を超える水深。0mなら直接浮上可能。'],
  fast:['急浮上','毎分10mより速く浮上した区間。気泡ができる危険が高まる。'],
  mod:['MOD (最大運用水深)','酸素分圧が1.2・1.4・1.6barになる水深。濃い線(1.4)が基準で、超えると警告。1.2は保守的、1.6は緊急時の上限。グラフ範囲内(ナイトロックス)の時に表示。'],
  on:['窒素 吸収中','吸っている窒素の分圧が組織より高く、窒素が溜まっている状態(主に潜降中や深く留まっている時)。'],
  off:['窒素 排出中','組織の窒素が吸っているものより多く、抜けている状態(主に浮上中・水面休息中)。'],
  pct:['バー %','組織の窒素分圧 ÷ 浮上許容限界(GF High)。100%を超えるコンパートメントが一つでもあれば直接浮上不可 = 減圧が必要。'],
  deco:['減圧が必要','NDLを超えたため、浮上前に決められた水深で決められた時間止まる必要がある状態。'],
  nodeco:['無減圧','減圧停止なしで直接浮上できる状態。安全停止のみ推奨。'],
  safety:['安全停止','5mで3分。義務ではないが気泡を減らすため推奨。推奨経路に自動で含まれる。'],
  tank:['タンク','タンク容量(L)と充填圧(bar)。ダイブごとに満タンのタンク1本で計算。グラフ右端のバーが残圧、オレンジの線が50bar(浮上時の余裕)。'],
  sac:['呼吸量 (SAC)','水面で1分間に吸う空気量。深いほど圧力の分だけ多く使う(20m=3倍)。初心者は大体20〜25 L/分。緊張・寒さ・運動で増える。'],
  gf99:['GF99 (現在のGF)','現在の水深を基準に、最も窒素が溜まったコンパートメントが周囲圧とM値の間のどこにあるか(%)。0% = 周囲圧以下、100% = M値。減圧停止中にこの値がGF設定より低ければさらに浮上できる(Shearwaterの表記)。<br>名前の「99」に計算上の意味はない。Shearwaterは由来を明かしておらず、画面表示の文字数制限によるという推測などがある。意味は「現在の水深基準のGF」。'],
  swIn:['吸気の窒素','今吸っている窒素の分圧。バーがこの線より短ければ吸収、長ければ排出。'],
  swAmb:['周囲圧','現在の水深の圧力。バーがこの線を超えるのは正常(過飽和、点線の枠)= 窒素が抜けている状態。危険の基準はGF限界線とM値。'],

function sampleDepth(pts,n){

<script>
// ===== 튜토리얼 =====
(function(){
const H=document.getElementById('tutHand'),BOX=document.getElementById('tutBox');
let TOK=0,IDX=0,ON=false,VOICE=true,AUTO=true,DONE=-1;
const SS=window.speechSynthesis;
let VSEL;
function koVoice(){if(VSEL!==undefined)return VSEL;try{const all=SS.getVoices();if(!all.length)return null;
  const ko=all.filter(x=>/^ko/i.test(x.lang)&&!/eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|bad news|bells|boing|bubbles|cellos|jester|organ|superstar|trinoids|whisper|wobble|zarvox/i.test(x.name));
  const pref=['Yuna','유나','Sora','Google 한국의','SunHi','Heami','InJoon'];
  VSEL=ko.find(x=>pref.some(p=>x.name.includes(p)))||ko.find(x=>x.default)||ko.find(x=>x.localService)||ko[0]||null;}catch(e){VSEL=null;}return VSEL;}
function spokenText(html){
  let t=html.replace(/<br\s*\/?>/g,'. ').replace(/<[^>]+>/g,'').replace(/[①-⑳]/g,'').replace(/→/g,', ').replace(/·/g,', ').replace(/—/g,', ');
  t=t.replace(/GF High/g,'지에프 하이').replace(/GF/g,'지에프').replace(/NDL/g,'엔디엘').replace(/50bar/g,'50바').replace(/(\d+)bar/g,'$1바').replace(/bar/g,'바')
     .replace(/(\d+(?:\.\d+)?)\s*L(?![a-zA-Z])/g,'$1리터').replace(/(\d+)~(\d+)m\/분/g,'분당 $1에서 $2미터').replace(/(\d+)m\/분/g,'분당 $1미터').replace(/분당 (\d+)m/g,'분당 $1미터').replace(/(\d+)~(\d+)m/g,'$1에서 $2미터').replace(/(\d+)m(?![a-zA-Z])/g,'$1미터')
     .replace(/(\d+)\/(\d+)/g,'$1 $2').replace(/\(/g,', ').replace(/\)/g,', ');
  return t;}
function speak(text,onProg){return new Promise(res=>{if(!VOICE||!SS){res();return;}
  try{const busy=SS.speaking||SS.pending;if(busy)SS.cancel();const sp=spokenText(text);const u=new SpeechSynthesisUtterance(sp);if(onProg)u.onboundary=ev=>{if(ev.charIndex!=null)onProg(ev.charIndex/sp.length);};u.lang='ko-KR';const v=koVoice();if(v)u.voice=v;u.rate=1.05;
    let done=false;const fin=()=>{if(!done){done=true;res();}};u.onend=fin;u.onerror=fin;setTimeout(fin,Math.max(3500,text.length*190));window.__tutU=u;
    const go=()=>{try{SS.resume();}catch(e){}SS.speak(u);};if(busy)setTimeout(go,150);else go();}catch(e){res();}});}
// 녹음 음성(tut/ko01~13.mp3) — 실패 시 브라우저 음성으로 대체
const AU=new Audio();AU.preload='auto';const CH=new Audio('tut/chime.mp3');CH.preload='auto';let CHTOK=0;
const clip=n=>'tut/ko'+String(n).padStart(2,'0')+'.mp3';
const auProg=()=>(AU.duration&&!AU.paused)?AU.currentTime/AU.duration:null;
let CLIPTOK=0;
function playClip(src,fallback){return new Promise(res=>{if(!VOICE){res();return;}let done=false;const my=++CLIPTOK;
  const fin=()=>{if(done)return;done=true;clearTimeout(to);AU.onended=AU.onerror=null;res();};
  const fail=()=>{if(done)return;done=true;clearTimeout(to);if(my!==CLIPTOK){res();return;}AU.onended=AU.onerror=null;if(fallback)fallback().then(res);else res();};
  const to=setTimeout(fin,40000);
  try{try{if(SS&&(SS.speaking||SS.pending))SS.cancel();}catch(e){}AU.pause();AU.muted=false;AU.src=src;AU.onended=fin;AU.onerror=fail;
    const pr=AU.play();if(pr&&pr.catch)pr.catch(e=>{if(e&&(e.name==='NotAllowedError'||e.name==='AbortError'))fin();else fail();});}catch(e){fail();}});}
// 글자를 읽는 속도에 맞춰 하나씩 표시
let TW=null;
function typeInit(el){const nodes=[];const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode()))nodes.push([n,n.nodeValue]);
  let total=0;nodes.forEach(x=>{total+=x[1].length;x[0].nodeValue='';});
  const show=k=>{let left=Math.round(k);for(const [nd,tx] of nodes){const c=Math.max(0,Math.min(tx.length,left));nd.nodeValue=tx.slice(0,c);left-=tx.length;}};
  return {total,show,shown:0};}
function typeRun(el,tok,voiced,get){const T0=typeInit(el);TW=T0;const cps=get?2:voiced?8:16;let start=performance.now(),boost=0;
  T0.prog=p=>{boost=Math.max(boost,p*T0.total);};
  const tick=()=>{if(TW!==T0||tok!==TOK)return;if(get){const p=get();if(p!=null)boost=Math.max(boost,Math.min(1,p*1.04)*T0.total);}const by=(performance.now()-start)/1000*cps;T0.shown=Math.min(T0.total,Math.max(T0.shown,by,boost));T0.show(T0.shown);if(T0.shown<T0.total)requestAnimationFrame(tick);};
  requestAnimationFrame(tick);return T0;}
function typeAll(){if(TW){TW.shown=TW.total;TW.show(TW.total);}}
function hush(){try{AU.pause();}catch(e){}try{if(SS&&(SS.speaking||SS.pending))SS.cancel();}catch(e){}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
class Stop extends Error{}
const chk=t=>{if(t!==TOK)throw new Stop();};
let hx=innerWidth/2,hy=innerHeight/2;
const showHand=v=>{H.style.display=v?'block':'none';};
const setHand=(x,y)=>{hx=x;hy=y;H.style.left=x+'px';H.style.top=y+'px';};
async function moveTo(x,y,ms,t){const x0=hx,y0=hy,n=Math.max(1,Math.round(ms/16));for(let i=1;i<=n;i++){chk(t);const u=i/n,e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;setHand(x0+(x-x0)*e,y0+(y-y0)*e);await sleep(16);}}
function ripple(x,y){const d=document.createElement('div');d.className='tutRip';d.style.left=x+'px';d.style.top=y+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),700);}
async function scrollTo(el,t,block){el.scrollIntoView({behavior:'smooth',block:block||'center'});await sleep(650);chk(t);}
const ctr=el=>{const r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2];};
const cpt=(tm,d)=>{const r=cv.getBoundingClientRect();return [r.left+FS*X(tm),r.top+FS*Y(d)];};
async function tapEl(el,t,click=true){const [x,y]=ctr(el);await moveTo(x,y,550,t);el.classList.add('tutHi');ripple(x,y);await sleep(220);chk(t);if(click)el.click();await sleep(380);el.classList.remove('tutHi');chk(t);}
async function point(el,t,ms){const [x,y]=ctr(el);await moveTo(x,y,600,t);el.classList.add('tutHi');await sleep(ms||900);el.classList.remove('tutHi');chk(t);}
function setState(pts,mode){stopPlay();SEL=-1;S.start=null;S.dives=[newDive()];S.cur=0;S.dives[0].pts=pts.map(([a,b])=>({t:a,d:b}));S.mode=mode||'none';S.bm='surf';
  S.alt=0;S.altSel='0';S.water='salt';S.gasSel='21';S.o2=21;S.cons='med';S.asc=9;S.tankV=12;S.tankP=200;S.sac=20;S.sacSel='20';S.setOpen=false;
  syncForm();syncBM();recompute();modeChanged();}
async function drawPath(path,t,dur){ // 그리기 모드 손 드래그
  const dv=dive();dv.pts=[{t:0,d:0}];drawing=true;
  const seg=[];for(let i=1;i<path.length;i++)seg.push([path[i-1],path[i]]);
  const n=Math.round(dur/16);let [x,y]=cpt(path[0][0],path[0][1]);await moveTo(x,y,400,t);
  for(let i=1;i<=n;i++){chk(t);const u=i/n*seg.length,k=Math.min(seg.length-1,Math.floor(u)),f=u-k;const [a,b]=seg[k];
    const tm=a[0]+(b[0]-a[0])*f,d=a[1]+(b[1]-a[1])*f+(Math.sin(i*.7)*.25);addFree(tm,Math.max(0,d));[x,y]=cpt(tm,d);setHand(x,y);drawProfile();await sleep(16);}
  drawing=false;}
async function tapPoint(tm,d,t){const [x,y]=cpt(tm,d);await moveTo(x,y,500,t);ripple(x,y);await sleep(200);chk(t);
  const pts=dive().pts;pushUndo();const q={t:tm,d};let i=pts.findIndex(p=>p.t>tm);if(i<0)i=pts.length;pts.splice(i,0,q);recompute();await sleep(350);chk(t);}
async function dragPoint(from,to,t){const pts=dive().pts;let i=pts.findIndex(p=>p.t===from[0]&&p.d===from[1]);if(i<0)return;
  let [x,y]=cpt(from[0],from[1]);await moveTo(x,y,500,t);ripple(x,y);await sleep(250);pushUndo();
  const n=50;for(let k=1;k<=n;k++){chk(t);const u=k/n,tm=from[0]+(to[0]-from[0])*u,d=from[1]+(to[1]-from[1])*u;pts[i]={t:tm,d};[x,y]=cpt(tm,d);setHand(x,y);if(k%5===0||k===n)recompute();else drawProfile();await sleep(24);}
  pts[i]={t:to[0],d:to[1]};recompute();await sleep(300);}
async function delPoint(tm,d,t){const [x,y]=cpt(tm,d);await moveTo(x,y,500,t);ripple(x,y);await sleep(220);const pts=dive().pts;const i=pts.findIndex(p=>p.t===tm&&p.d===d);if(i>0){pushUndo();pts.splice(i,1);recompute();}await sleep(350);chk(t);}
async function waitPlay(t){while(P.run){chk(t);await sleep(100);}}
const GRAPH=()=>cv,BARS=()=>$('bars');
// --- 경로 상태
const A0=[[0,0]],A1=[[0,0],[180,18],[1500,18]],A2=[...A1,[1620,10],[1740,5],[1920,5],[1980,0]],
A3=[[0,0],[180,18],[1320,18],[1440,10],[1560,5],[1740,5],[1800,0]],
A4=[[0,0],[180,18],[1320,18],[1440,10],[1950,10],[2070,5],[2250,5],[2310,0]],
B1=[[0,0],[180,30],[1680,30],[1800,0]],B2=[[0,0],[180,30],[1680,30]],
B3=[[0,0],[180,30],[780,30],[960,12],[1620,12],[1740,5],[1920,5],[1980,0]];
async function dragGroup(fromT,dt,t){ // fromT 이후 점을 한꺼번에 오른쪽으로
  const pts=dive().pts;const idx=pts.map((p,i)=>p.t>=fromT?i:-1).filter(i=>i>=0);if(!idx.length)return;const base=idx.map(i=>pts[i].t);
  const p0=pts[idx[0]];let [x,y]=cpt(p0.t,p0.d);await moveTo(x,y,500,t);ripple(x,y);await sleep(250);pushUndo();
  const n=50;for(let k=1;k<=n;k++){chk(t);const u=k/n;idx.forEach((i,j)=>{pts[i]={t:base[j]+dt*u,d:pts[i].d};});[x,y]=cpt(base[0]+dt*u,p0.d);setHand(x,y);if(k%5===0||k===n)recompute();else drawProfile();await sleep(24);}
  idx.forEach((i,j)=>{pts[i]={t:base[j]+dt,d:pts[i].d};});recompute();await sleep(300);}
let OVL=null;
function hideOverlay(){if(OVL){OVL.remove();OVL=null;}}
async function showRules(t){hideOverlay();const card=cv.closest('.card'),r=card.getBoundingClientRect();
  OVL=document.createElement('div');Object.assign(OVL.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',background:'rgba(15,20,26,.86)',borderRadius:'10px',zIndex:57,display:'flex',flexDirection:'column',justifyContent:'center',gap:'10px',padding:'14px',boxSizing:'border-box'});
  document.body.appendChild(OVL);
  const items=['핑크색 천장이 안 나오게 (무감압)','나오면 절대 침범하지 않기','상승은 분당 9~10m 이하 · 5m 3분 안전정지','출수 때 공기 50bar 이상'];
  const RT=[0,4.15,7.58,12.76],synced=()=>!AU.paused&&/ko12\.mp3$/.test(AU.src);
  for(let i=0;i<items.length;i++){chk(t);
    if(synced()){while(synced()&&AU.currentTime<RT[i]){await sleep(50);chk(t);}}else if(i>0)await sleep(900);
    chk(t);const b=document.createElement('div');
    Object.assign(b.style,{background:'#E31B3F',color:'#fff',borderRadius:'10px',padding:'12px 14px',fontWeight:'800',fontSize:'clamp(15px,4.4vw,20px)',lineHeight:'1.35',wordBreak:'keep-all',opacity:0,transform:'translateX(-14px)',transition:'all .35s ease-out'});
    b.innerHTML=`<span style="opacity:.75;margin-right:8px">${i+1}</span>${items[i]}`;OVL.appendChild(b);await sleep(40);b.style.opacity=1;b.style.transform='none';}
  await sleep(900);}
const STEPS=[
{p:'1부 · 무감압 다이빙',ti:'① 그리기 모드',tx:'<b>그리기</b>를 고르고 그래프 위를 누른 채로 끌면 수심 경로가 그려져요. 가로는 시간, 세로는 수심이에요.',
 set:()=>setState(A0,'none'),go:async t=>{await scrollTo(GRAPH(),t);await tapEl($('mFree'),t);}},
{p:'1부 · 무감압 다이빙',ti:'② 내려가서 머물기',tx:'3분에 걸쳐 18미터까지 내려가 25분까지 머물러 볼게요. 출수하기 전에 손을 떼면 <span style="color:#34d399">추천 경로</span>가 자동으로 이어져요. 5미터 안전정지 3분 후 출수하라는 뜻이에요.',
 set:()=>setState(A0,'free'),go:async t=>{await scrollTo(GRAPH(),t);await drawPath([[0,0],[180,18],[1500,18]],t,2600);dive().pts=A1.map(([a,b])=>({t:a,d:b}));recompute();await sleep(500);}},
{p:'1부 · 무감압 다이빙',ti:'③ 점찍기로 상승 만들기',tx:'<b>점찍기</b>로 바꾸고 점을 하나씩 찍어요. 10미터에서 5미터까지는 <b>분당 9미터 이하</b>로 천천히, <b>5미터에서 3분 안전정지</b> 후 수면으로. 수면에 닿으면 다이빙이 끝나요.',
 set:()=>setState(A1,'free'),go:async t=>{await scrollTo(GRAPH(),t);await tapEl($('mPt'),t);for(const [a,b] of [[1620,10],[1740,5],[1920,5],[1980,0]])await tapPoint(a,b,t);}},
{p:'1부 · 무감압 다이빙',ti:'④ 점을 끌어서 다듬기',tx:'점은 끌어서 옮길 수 있어요. 바닥을 떠나는 점을 25분에서 <b>22분</b>으로 당겨 바닥 시간을 줄였어요. 그리고 다이빙 시간을 늘였어요. 바닥 시간이 짧을수록 NDL이 커지고 공기도 덜 써요.',
 set:()=>setState(A2,'pt'),go:async t=>{await scrollTo(GRAPH(),t);await dragPoint([1500,18],[1320,18],t);
   const pts=dive().pts;const sh=[[1620,1440],[1740,1560],[1920,1740],[1980,1800]];
   for(const [f,to] of sh){const i=pts.findIndex(p=>p.t===f);if(i>0)pts[i].t=to;}recompute();await sleep(400);
   await dragGroup(1560,510,t);await tapPoint(1950,10,t);dive().pts=A4.map(([a,b])=>({t:a,d:b}));recompute();}},
{p:'1부 · 무감압 다이빙',ti:'⑤ 잘못 찍은 점 지우기',tx:'실수로 엉뚱한 곳에 점을 찍었어요. <b>점지우기</b>를 고르고, 그 점을 누르면 지워져요. 실행취소로 되돌릴 수도 있어요.',
 set:()=>setState(A4,'pt'),go:async t=>{await scrollTo(GRAPH(),t);await tapPoint(900,10,t);await sleep(500);await tapEl($('mDel'),t);await delPoint(900,10,t);await tapEl($('mDel'),t);}},
{p:'1부 · 무감압 다이빙',ti:'⑥ 이상적인 무감압 다이빙',tx:'완성! <b>핑크색 천장이 없고</b>, 경고도 없어요. 라벨은 최대 수심과 총 시간, 그래프 오른쪽 끝 막대는 <b>남은 공기</b>예요. 출수 때 50바 이상 남기는 게 기본이에요.',
